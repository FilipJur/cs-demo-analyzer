[project]
name = "cs-demo-analyzer"
version = "0.1.0"
description = "Local-first CS2 demo ingestion and replay"
requires-python = ">=3.13,<3.14"
dependencies = [
  "awpy==3.0.0", "polars==2.0.0", "fastapi==0.143.1",
  "uvicorn==0.54.0", "pydantic==2.14.1", "watchfiles==1.3.0", "srctools==2.7.0",
]

[project.scripts]
csda = "cs_demo_analyzer.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_demo_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local_demo: requires CSDA_TEST_DEMO; never downloads gameplay"]
